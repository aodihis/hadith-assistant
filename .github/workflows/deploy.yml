name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Gate the deploy on the same checks `make check` runs locally. Pushing a
      # broken image and finding out from the site is the failure mode this
      # exists to prevent.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  publish:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          APP_HOST: ${{ vars.APP_HOST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          EMBEDDING_BASE_URL: ${{ vars.EMBEDDING_BASE_URL }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          CHAT_BASE_URL: ${{ vars.CHAT_BASE_URL }}
          CHAT_MODEL: ${{ vars.CHAT_MODEL }}
          QDRANT_COLLECTION: ${{ vars.QDRANT_COLLECTION }}
          RETRIEVAL_MIN_SCORE: ${{ vars.RETRIEVAL_MIN_SCORE }}
          RUST_LOG: ${{ vars.RUST_LOG }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          # Written on the runner rather than with a heredoc, so nothing here is
          # re-parsed by YAML. APP_HOST is repeated into the compose file's
          # ${APP_HOST} interpolation as well as the app's own config.
          printf '%s\n' \
            "APP_HOST=$APP_HOST" \
            "HOST=0.0.0.0" \
            "PORT=3000" \
            "DATABASE_URL=$DATABASE_URL" \
            "SESSION_SECRET=$SESSION_SECRET" \
            "OPEN_ROUTER_API_KEY=$OPEN_ROUTER_API_KEY" \
            "VECTOR_DB_PROVIDER=qdrant" \
            "QDRANT_URL=http://qdrant:6334" \
            "QDRANT_COLLECTION=${QDRANT_COLLECTION:-hadith_vectors}" \
            "RETRIEVAL_MIN_SCORE=${RETRIEVAL_MIN_SCORE:-0.25}" \
            "EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-https://api.openai.com/v1}" \
            "EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}" \
            "CHAT_BASE_URL=${CHAT_BASE_URL:-https://openrouter.ai/api/v1}" \
            "CHAT_MODEL=${CHAT_MODEL:-deepseek/deepseek-v4-flash}" \
            "RUST_LOG=${RUST_LOG:-info}" \
            > .env.prod

          # Prepare VPS directory and copy files
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "mkdir -p /opt/apps/sanad"
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml "$VPS_USER@$VPS_HOST":/opt/apps/sanad/docker-compose.prod.yml
          scp -i ~/.ssh/deploy_key .env.prod "$VPS_USER@$VPS_HOST":/opt/apps/sanad/.env

          # Pull latest image and restart
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "
            set -e
            echo '$GH_TOKEN' | docker login ghcr.io -u $GH_ACTOR --password-stdin
            cd /opt/apps/sanad
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
          "
